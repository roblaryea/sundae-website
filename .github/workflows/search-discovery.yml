name: Search Discovery

on:
  push:
    branches: [main]
  schedule:
    - cron: '15 5 * * 1'
  workflow_dispatch:

concurrency:
  group: search-discovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sitemap-health:
    name: Production sitemap health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Wait for the production alias after a main deployment
        if: github.event_name == 'push'
        run: sleep 90
      - name: Report locale and content inventory
        run: node scripts/report-sitemap-inventory.mjs

  indexnow:
    name: Notify Bing and IndexNow
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Wait for the production alias after a main deployment
        if: github.event_name == 'push'
        run: sleep 90
      - name: Wait for key verification and submit priority URLs
        run: node scripts/submit-indexnow.mjs --wait-for-key
