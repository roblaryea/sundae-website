name: Quality Gates

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

jobs:
  quality:
    name: Lint, Blog QA, Page QA & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Blog copy QA
        run: npm run qa:blog-copy

      - name: Page copy QA
        run: npm run qa:page-copy

      - name: i18n stack QA
        run: npm run qa:i18n

      - name: Translation quality QA
        run: npm run qa:translation

      # Content must not be hidden behind a reduced-motion check, and a
      # position:fixed overlay must not be trapped by a transformed or
      # filtered ancestor. Both shipped to production before these existed.
      - name: Reduced-motion QA
        run: npm run qa:reduced-motion

      - name: Fixed-positioning QA
        run: npm run qa:fixed-position

      - name: Build
        run: npm run build
